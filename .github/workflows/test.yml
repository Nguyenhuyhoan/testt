name: test

on:
  workflow_dispatch: # Cho phép bấm nút bật bằng tay trên iPhone

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Khởi chạy Anisette v3 Server
        run: |
          docker run -d --name anisette -p 6969:6969 dadoum/anisette-v3-server:latest
          sleep 5

      - name: 2. Tạo đường link HTTPS qua Cloudflare
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://localhost:6969 > tunnel.log 2>&1 &
          sleep 8
          echo "=========================================="
          echo "ĐƯỜNG LINK MÁY CHỦ CỦA BẠN LÀ:"
          grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1
          echo "=========================================="

      - name: 3. Giữ máy chủ mở trong 15 phút để Refresh
        run: sleep 900
