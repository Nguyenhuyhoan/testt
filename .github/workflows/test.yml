name: Anisette Server (Mac OS X)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: macos-13 # Máy Mac OS X chip Intel (Hỗ trợ ảo hóa và không bị lỗi VZ)
    steps:
      - name: Khởi chạy Anisette trên Mac OS X
        run: |
          # 1. Cài đặt trình biên dịch D (ldc) và công cụ trên Mac OS X
          brew install ldc dub openssl cloudflared
          
          # 2. Tải mã nguồn Anisette v3 và chạy trực tiếp trên Mac OS X (Không cần Docker!)
          git clone https://github.com/Dadoum/anisette-v3-server.git
          cd anisette-v3-server
          
          echo "Đang biên dịch phần mềm trực tiếp cho Mac OS X (Mất khoảng 40 giây)..."
          dub build --build=release --compiler=ldc2
          
          # 3. Khởi chạy máy chủ trực tiếp trên IP của máy Mac
          ./anisette-v3-server -n 0.0.0.0 -p 6969 > anisette.log 2>&1 &
          sleep 8
          
          echo "=== KIỂM TRA TRANG CHỦ TRÊN MAC OS X ==="
          curl -i -s http://127.0.0.1:6969
          echo ""
          echo "=== KIỂM TRA CỔNG V3 TRÊN MAC OS X ==="
          curl -i -s http://127.0.0.1:6969/v3/client_info
          echo ""
          echo "=== NHẬT KÝ MÁY CHỦ ==="
          cat anisette.log
          echo "======================="

          # 4. Mở đường truyền Cloudflare
          cloudflared tunnel --url http://127.0.0.1:6969 > tunnel.log 2>&1 &
          sleep 12
          
          LINK=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
          echo "========================================================="
          echo "ĐƯỜNG LINK MÁY CHỦ MAC OS X CỦA BẠN LÀ:"
          echo "${LINK}"
          echo "========================================================="
          
          # Giữ máy mở 15 phút
          sleep 900
