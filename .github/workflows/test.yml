name: Anisette uuuu

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Khởi chạy Anisette chuẩn V3 và mở cổng Cloudflare
        run: |
          # 1. Bật máy chủ
          docker run -d --user root --name anisette -p 6969:6969 dadoum/anisette-v3-server:latest
          sleep 5
          
          echo "=== KIỂM TRA CỔNG V3 (DÀNH CHO SIDESTORE MỚI) ==="
          curl -i -s http://127.0.0.1:6969/v3/client_info
          echo ""
          echo "================================================="

          # 2. Bật đường truyền Cloudflare
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://127.0.0.1:6969 > tunnel.log 2>&1 &
          
          echo "Đang chờ Cloudflare cấp link (15 giây)..."
          sleep 15
          
          LINK=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
          echo "========================================================="
          echo "1. BẤM THỬ LINK NÀY TRÊN SAFARI SẼ THẤY KHÔNG BỊ LỖI 500:"
          echo "${LINK}/v3/client_info"
          echo ""
          echo "2. ĐƯỜNG LINK ĐỂ DÁN VÀO SIDESTORE (HOẶC CODE SIDESTORE):"
          echo "${LINK}"
          echo "========================================================="
          
          # Giữ máy chủ mở trong 15 phút để bạn vào SideStore test Login/Refresh
          sleep 900
