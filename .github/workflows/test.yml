name: Anisette ppppp

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tải mã nguồn bằng công cụ chính thức của GitHub (Chống nghẽn mạng)
        uses: actions/checkout@v4
        with:
          repository: Dadoum/anisette-v3-server

      - name: 2. Chạy thử và Bắt bệnh lỗi 500
        run: |
          # Chạy bản Docker có sẵn và gắn thư mục lưu trữ rõ ràng
          mkdir -p /tmp/anisette_cache
          chmod 777 /tmp/anisette_cache
          
          docker run -d --user root --name anisette \
            -v /tmp/anisette_cache:/root/.config/anisette-v3 \
            -p 6969:6969 \
            dadoum/anisette-v3-server:latest
            
          sleep 5
          
          echo "=== GỌI THỬ VÀO MÁY CHỦ ==="
          curl -i http://127.0.0.1:6969
          echo ""
          
          echo "=== NGUYÊN NHÂN GÂY LỖI 500 (NHẬT KÝ CHI TIẾT) ==="
          docker logs anisette
          echo "=================================================="
