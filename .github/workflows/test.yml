name: Anisette 😂

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tải và chạy trực tiếp Anisette v3 (Không qua Docker)
        run: |
          # Tải trực tiếp file chạy gốc từ GitHub của tác giả Dadoum
          wget -q https://github.com/Dadoum/anisette-v3-server/releases/latest/download/anisette-v3-server-x86_64-unknown-linux-gnu.tar.gz -O anisette.tar.gz
          tar -xzf anisette.tar.gz
          chmod +x anisette-v3-server
          
          # Khởi chạy máy chủ ở cổng 6969 và ghi lại nhật ký
          ./anisette-v3-server --host 127.0.0.1 --port 6969 > anisette.log 2>&1 &
          
          echo "Đang chờ máy chủ tải thư viện từ Apple (10 giây)..."
          sleep 10
          
          echo "=== KIỂM TRA TRẠNG THÁI MÁY CHỦ ==="
          cat anisette.log
          echo "==================================="

      - name: 2. Tạo đường link HTTPS qua Cloudflare
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://127.0.0.1:6969 > tunnel.log 2>&1 &
          sleep 8
          echo "=========================================="
          echo "ĐƯỜNG LINK MÁY CHỦ CỦA BẠN LÀ:"
          grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1
          echo "=========================================="

      - name: 3. Giữ máy chủ mở trong 15 phút
        run: sleep 900
