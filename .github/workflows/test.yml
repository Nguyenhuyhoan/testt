
name: Anisette Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Khởi chạy Máy chủ Anisette (Bản vá lỗi 500 mới nhất)
        run: |
          echo "1. Đang tải mã nguồn mới nhất từ nhóm phát triển SideStore..."
          git clone https://github.com/SideStore/anisette-v3-server.git
          cd anisette-v3-server
          
          echo "2. Đang tự đóng gói máy chủ (Mất khoảng 45 giây, vui lòng chờ)..."
          docker build -t my-anisette .
          
          echo "3. Khởi chạy máy chủ..."
          docker run -d --user root --name anisette -p 6969:6969 my-anisette
          sleep 5
          
          echo "4. Yêu cầu máy chủ tải thư viện mới từ Apple..."
          curl -s http://127.0.0.1:6969 > /dev/null
          sleep 10
          
          echo "=== KIỂM TRA DỮ LIỆU APPLE TRẢ VỀ ==="
          curl -i -s http://127.0.0.1:6969 | head -n 20
          echo ""
          echo "====================================="

          # 5. Bật đường truyền Cloudflare
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://127.0.0.1:6969 > tunnel.log 2>&1 &
          
          echo "Đang chờ Cloudflare cấp link (15 giây)..."
          sleep 15
          
          echo "=========================================="
          echo "ĐƯỜNG LINK MÁY CHỦ CỦA BẠN LÀ:"
          grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1
          echo "=========================================="
          
          # Giữ máy chủ sống trong 15 phút
          sleep 900
