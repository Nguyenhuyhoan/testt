
name: Anisette Server (macOS)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: macos-latest # Đổi sang máy tính Mac thật của Apple để lấy IP sạch
    steps:
      - name: Khởi chạy Anisette trên máy Mac và kiểm tra lỗi 500
        run: |
          # 1. Cài đặt Docker nhẹ (Colima) cho máy Mac của GitHub
          brew install colima docker cloudflared
          colima start --cpu 2 --memory 2
          
          # 2. Chạy máy chủ Anisette trên dải IP của máy Mac
          docker run -d --user root --name anisette -p 6969:6969 dadoum/anisette-v3-server:latest
          sleep 5
          
          echo "=== KIỂM TRA TRANG CHỦ (XEM CÒN LỖI 500 KHÔNG) ==="
          curl -i -s http://127.0.0.1:6969
          echo ""
          echo "=== NHẬT KÝ MÁY CHỦ ==="
          docker logs anisette
          echo "======================="

          # 3. Mở đường truyền Cloudflare
          cloudflared tunnel --url http://127.0.0.1:6969 > tunnel.log 2>&1 &
          sleep 12
          
          LINK=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
          echo "========================================================="
          echo "ĐƯỜNG LINK MÁY CHỦ TRÊN MAC CỦA BẠN LÀ:"
          echo "${LINK}"
          echo "========================================================="
          
          # Giữ máy mở 15 phút
          sleep 900
