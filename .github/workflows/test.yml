name: AnisettePP

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Khởi chạy Anisette v3 với quyền Admin (Sửa lỗi 500)
        run: |
          # Thêm --user root để cấp toàn quyền ghi file, chống lỗi 500
          docker run -d --user root --name anisette -p 6969:6969 dadoum/anisette-v3-server:latest
          
          echo "Chờ 5 giây cho máy chủ khởi động..."
          sleep 5
          
          # Tự động kích hoạt lần đầu để máy chủ tải sẵn thư viện từ Apple về
          echo "Đang yêu cầu máy chủ tải thư viện gốc từ Apple..."
          curl -s http://127.0.0.1:6969 > /dev/null
          sleep 10
          
          echo "=== KIỂM TRA NHẬT KÝ MÁY CHỦ ==="
          docker logs anisette
          echo "================================"
          
          echo "=== DỮ LIỆU ANISETTE THỬ NGHIỆM ==="
          curl -s http://127.0.0.1:6969 | head -c 300
          echo ""
          echo "==================================="

      - name: 2. Tạo đường link HTTPS qua Cloudflare
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://127.0.0.1:6969 > tunnel.log 2>&1 &
          sleep 8
          echo "=========================================="
          echo "ĐƯỜNG LINK MÁY CHỦ CỦA BẠN LÀ:"
          grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1
          echo "=========================================="

      - name: 3. Giữ máy chủ mở trong 15 phút
        run: sleep 900
